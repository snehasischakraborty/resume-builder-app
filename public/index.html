<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resume Builder - Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="center">
  <div class="card">
    <h1>Resume Builder</h1>
    <div class="tabs">
      <button id="tabLogin" class="active">Login</button>
      <button id="tabRegister">Register</button>
    </div>
    <form id="authForm">
      <input id="name" placeholder="Full name" class="hidden" />
      <input id="email" type="email" placeholder="Email" required />
      <input id="password" type="password" placeholder="Password (min 6)" required />
      <button type="submit" id="submitBtn">Login</button>
      <p id="msg" class="error"></p>
    </form>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
